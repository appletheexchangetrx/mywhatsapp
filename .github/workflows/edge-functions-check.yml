name: Edge Function and PWA checks

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "assets/js/**"
      - "src/js/**"
      - "assets/icons/**"
      - "tests/**"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/edge-functions-check.yml"
  push:
    branches: ["main", "fix/platform-remediation"]
    paths:
      - "supabase/functions/**"
      - "assets/js/**"
      - "src/js/**"
      - "assets/icons/**"
      - "tests/**"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - ".github/workflows/edge-functions-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Service Worker syntax
        run: node --check sw.js

      - name: Validate JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find assets/js src/js -type f -name '*.js' -print0)

      - name: Test frontend state modules
        run: node --test tests/*.test.mjs

      - name: Validate PWA manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          required = ["name", "short_name", "start_url", "display", "icons"]
          missing = [key for key in required if key not in manifest]
          if missing:
              raise SystemExit(f"Manifest missing required fields: {missing}")
          for path in ["sw.js", "assets/icons/whatsapp-inbox.svg", "index.html", "src/js/app.js"]:
              if not Path(path).is_file():
                  raise SystemExit(f"Required PWA file missing: {path}")
          PY

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test cloud-tools request validation
        run: deno test --allow-env supabase/functions/cloud-tools/validation_test.ts

      - name: Test cloud-tools reliability primitives
        run: deno test --allow-env supabase/functions/cloud-tools/reliability_test.ts

      - name: Test P1 migration and transactional reliability scenarios
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do sleep 1; done
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create table public.trx_messages (
            id uuid primary key default gen_random_uuid(),
            wamid text not null unique,
            from_phone text not null,
            profile_name text,
            phone_number_id text,
            display_phone_number text,
            message_type text not null,
            text_body text,
            message_timestamp timestamptz,
            raw_message jsonb not null,
            created_at timestamptz not null default now(),
            direction text not null default 'inbound' check (direction in ('inbound', 'outbound')),
            status text,
            recipient_phone text,
            error_details jsonb,
            interactive_type text,
            context_wamid text,
            from_user_id text
          );
          alter table public.trx_messages enable row level security;
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f supabase/migrations/20261126130000_add_cloud_tools_p1_reliability.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f supabase/tests/cloud_tools_p1_reliability_test.sql

      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/cloud-tools/index.ts
          deno check supabase/functions/trx-webhook/index.ts
          deno check supabase/functions/trx-push-dispatch/index.ts
          deno check supabase/functions/trx-send-messages/index.ts
          deno check supabase/functions/trx-push-config/index.ts
          deno check supabase/functions/trx-push-subscribe/index.ts
          deno check supabase/functions/trx-push-unsubscribe/index.ts
          deno check supabase/functions/trx-vapid-generator/index.ts
