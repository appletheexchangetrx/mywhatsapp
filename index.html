<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <title>WhatsApp Inbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;color:#111b21}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#d9e1e5}body{font-size:14px}
.app{height:100dvh;min-height:560px;max-width:1200px;margin:0 auto;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px #00000018}
.topbar{height:64px;min-height:64px;background:#075e54;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}
.brand-mark{width:38px;height:38px;flex:none;border-radius:50%;background:#ffffff20;color:#fff;display:grid;place-items:center;font-size:21px}
.topbar .brand-copy{min-width:0;flex:1}.topbar .brand-title{font-size:17px;font-weight:700;line-height:1.2}.topbar .brand-subtitle{font-size:11px;color:#d7eee8;margin-top:3px}
#connection{font-size:11px;color:#e4f3ef;white-space:nowrap}.status-dot{width:8px;height:8px;background:#25d366;border-radius:50%;display:inline-block}
.page-tabs{display:flex;gap:24px;padding:0 18px;background:#fff;border-bottom:1px solid #e9edef;flex:none}
.page-tab{flex:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:15px 5px 12px;background:transparent;color:#667781;font-size:13px;font-weight:650;cursor:pointer}
.page-tab.active{border-bottom-color:#128c7e;color:#128c7e;background:transparent}
.workspace{display:flex;flex:1;min-height:0;background:#fff}
.sidebar{width:360px;min-width:300px;border-right:1px solid #e9edef;display:flex;flex-direction:column;background:#fff;min-height:0}
.search-wrap{padding:12px 14px;background:#fff;border-bottom:1px solid #f0f2f5}.search{width:100%;background:#f0f2f5;border:0;border-radius:9px;padding:11px 14px 11px 38px;outline:none;font-size:13px}
.contact{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;border-bottom:1px solid #f3f4f5;transition:background .15s}.contact:hover,.contact.active{background:#f0f2f5}
.avatar{width:48px;height:48px;flex:none;border-radius:50%;background:#dce9e6;color:#28665d;display:grid;place-items:center;font-weight:650;font-size:15px}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#efeae2}
.main .topbar{height:65px;min-height:65px;background:#f7f8f8;color:#111b21;justify-content:flex-start;padding:0 18px}
.main .topbar .muted,.main .topbar .text-slate-500{color:#667781}
.chat-bg{flex:1;min-height:0;overflow:auto;padding:22px clamp(14px,5vw,70px);background-color:#efeae2;background-image:radial-gradient(#d8d1c7 .65px,transparent .65px);background-size:14px 14px}
.bubble{max-width:min(76%,520px);padding:9px 11px 7px;border-radius:8px;margin:9px 0;box-shadow:0 1px 1px #00000012;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45}
.bubble.in{background:#fff;border-top-left-radius:2px;margin-right:auto}.bubble.out{background:#dcf8c6;border-top-right-radius:2px;margin-left:auto}
.bubble-meta{display:flex;justify-content:flex-end;gap:5px;color:#718078;font-size:10px;margin-top:4px}
.composer{background:#f0f2f5;padding:11px 16px;display:flex;gap:10px;align-items:flex-end;flex:none}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:44px;border:0;border-radius:22px;padding:12px 16px;outline:none;font:inherit;font-size:14px;background:#fff}
.send{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:#128c7e;color:#fff;display:grid;place-items:center;cursor:pointer}.send:hover{background:#075e54}.send:disabled{opacity:.5;cursor:not-allowed}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#667781;padding:24px}
.mobile-back{display:none;border:0;background:transparent;font-size:25px;color:#128c7e;cursor:pointer}.muted{color:#667781}
@media(max-width:700px){.app{height:100dvh;min-height:0}.topbar{height:58px;min-height:58px;padding:0 14px}.topbar .brand-title{font-size:16px}.page-tabs{gap:18px;padding:0 12px}.page-tab{padding:14px 4px 11px}.workspace{position:relative}.sidebar{width:100%;min-width:0;border:0}.main{display:none;width:100%}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex}.mobile-back{display:block}.main .topbar{height:60px;min-height:60px;padding:0 10px}.chat-bg{padding:15px 12px}.bubble{max-width:88%}.composer{padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}.contact{padding:11px 13px}}
@media(max-width:380px){#connection{font-size:0}#connection .status-dot{margin-right:0}.brand-mark{width:34px;height:34px}}
</style>
</head>
<body>

<div class="app" id="app">
<header class="topbar">
  <div class="brand-mark">✆</div>
  <div class="brand-copy"><div class="brand-title">WhatsApp Inbox</div><div class="brand-subtitle">Apple The Exchange TRX</div></div>
  <span id="connection" class="flex items-center gap-1.5"><span class="status-dot" style="background:#f59e0b"></span> Menghubungkan</span>
</header>
<nav class="page-tabs" aria-label="Navigasi pesan">
  <button class="page-tab active" data-page="inbox">Pesan Masuk</button>
  <button class="page-tab" data-page="reply">Balas Pesan</button>
</nav>
<div class="workspace">
<aside class="sidebar">
  <div class="search-wrap relative"><span class="absolute left-6 top-[18px] text-slate-400">⌕</span><input id="search" class="search" placeholder="Cari nama atau nomor..." aria-label="Cari percakapan" autocomplete="off"></div>
  <div class="px-4 py-3 text-[11px] font-semibold tracking-wide text-slate-500 flex justify-between"><span id="list-heading">PESAN MASUK</span><span id="message-count">0</span></div>
  <div id="conversation-list" class="flex-1 overflow-y-auto"></div>
  <div class="border-t border-slate-100 px-4 py-3 text-[10px] text-slate-400">Realtime · Supabase</div>
</aside>
<main class="main">
  <header id="chat-header" class="topbar"><div class="empty w-full"><div class="text-4xl mb-2">💬</div><div class="font-semibold text-slate-700">Pilih percakapan</div><div class="text-xs mt-1">Pilih pesan di sebelah kiri untuk melihat detail dan membalas.</div></div></header>
  <section id="message-area" class="chat-bg"><div class="empty"><div class="text-6xl mb-4">✉️</div><div class="text-lg font-semibold text-slate-700">WhatsApp Inbox</div><p class="text-sm max-w-sm mt-2">Pesan masuk akan muncul otomatis di sini. Pilih percakapan untuk mulai membaca dan membalas pesan.</p></div></section>
  <form id="composer" class="composer hidden"><textarea id="message-input" rows="1" placeholder="Ketik pesan..." aria-label="Tulis balasan"></textarea><button id="send-button" class="send" type="submit" aria-label="Kirim pesan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></form>
</main>
</div>
</div>

<script type="module">
import { fetchMessages, subscribeToMessages, sendWhatsAppMessage } from "./assets/js/messages.js";
(() => {
  const $ = id => document.getElementById(id);
  const state = { messages: [], conversations: new Map(), active: null, page: 'inbox', sending: false };
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const phoneOf = m => m.direction === 'outbound' ? (m.recipient_phone || m.from_phone || '') : (m.from_phone || '');
  const timestampOf = m => m.message_timestamp || m.created_at || null;
  const timeLabel = value => value ? new Date(value).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) : '';
  const initials = value => (String(value || '?').replace(/\D/g,'').slice(-2) || String(value || '?').slice(0,2)).toUpperCase();
  const textOf = m => m.text_body || (m.message_type && m.message_type !== 'text' ? '[' + m.message_type + ']' : '[Pesan tanpa teks]');
  function setConnection(label,color) { $('connection').innerHTML = '<span class="status-dot" style="background:'+color+'"></span> '+escapeHtml(label); }
  function buildConversations() {
    const map = new Map();
    for (const m of state.messages) {
      const phone = phoneOf(m); if (!phone) continue;
      if (!map.has(phone)) map.set(phone,{phone,name:m.profile_name || phone,messages:[],last:null,unread:0});
      const c = map.get(phone); c.messages.push(m);
      if (m.profile_name && m.direction === 'inbound') c.name = m.profile_name;
      if (!c.last || new Date(timestampOf(m)||0) > new Date(timestampOf(c.last)||0)) c.last = m;
    }
    for (const c of map.values()) c.messages.sort((a,b)=>new Date(timestampOf(a)||0)-new Date(timestampOf(b)||0));
    state.conversations = new Map([...map.entries()].sort((a,b)=>new Date(timestampOf(b[1].last)||0)-new Date(timestampOf(a[1].last)||0)));
  }
  function renderList() {
    const query = $('search').value.trim().toLowerCase();
    const entries = [...state.conversations.values()].filter(c=>c.phone.toLowerCase().includes(query)||c.name.toLowerCase().includes(query));
    $('message-count').textContent = state.conversations.size;
    $('list-heading').textContent = state.page === 'inbox' ? 'PESAN MASUK' : 'PILIH KONTAK';
    if (!entries.length) { $('conversation-list').innerHTML='<div class="p-8 text-center text-sm text-slate-400">'+(query?'Kontak tidak ditemukan.':'Belum ada pesan yang tersimpan.')+'</div>'; return; }
    $('conversation-list').innerHTML = entries.map(c => {
      const last=c.last||{}, preview=(last.direction==='outbound'?'Anda: ':'')+textOf(last);
      return '<button type="button" class="contact w-full text-left '+(state.active===c.phone?'active':'')+'" data-phone="'+escapeHtml(c.phone)+'"><div class="avatar">'+escapeHtml(initials(c.name))+'</div><div class="min-w-0 flex-1"><div class="flex items-center justify-between gap-2"><div class="font-semibold text-[14px] text-slate-800 truncate">'+escapeHtml(c.name)+'</div><time class="text-[10px] text-slate-400 flex-none">'+escapeHtml(timeLabel(timestampOf(last)))+'</time></div><div class="text-[12px] text-slate-500 truncate mt-1">'+escapeHtml(preview)+'</div><div class="text-[10px] text-slate-400 mt-1">'+escapeHtml(c.phone)+'</div></div></button>';
    }).join('');
    $('conversation-list').querySelectorAll('[data-phone]').forEach(el=>el.addEventListener('click',()=>openConversation(el.dataset.phone)));
  }
  function renderChat() {
    const c=state.conversations.get(state.active);
    if (!c) { $('chat-header').innerHTML='<div class="empty w-full"><div class="text-4xl">💬</div><div class="font-semibold mt-2">Pilih percakapan</div></div>'; $('message-area').innerHTML='<div class="empty"><div class="text-5xl">✉️</div><p class="mt-3 text-sm">Pilih pesan untuk melihat percakapan.</p></div>'; $('composer').classList.add('hidden'); return; }
    $('chat-header').innerHTML='<button class="mobile-back" id="back-button" aria-label="Kembali">‹</button><div class="avatar" style="width:40px;height:40px">'+escapeHtml(initials(c.name))+'</div><div class="min-w-0"><div class="font-semibold text-sm text-slate-800 truncate">'+escapeHtml(c.name)+'</div><div class="text-[11px] text-slate-500">'+escapeHtml(c.phone)+'</div></div><div class="ml-auto text-xs text-slate-500">WhatsApp</div>';
    const back=$('back-button'); if(back) back.addEventListener('click',()=>$('app').classList.remove('chat-open'));
    $('message-area').innerHTML=c.messages.map(m=>{const outgoing=m.direction==='outbound',body=escapeHtml(textOf(m)),status=outgoing&&m.status?'<span>'+escapeHtml(m.status)+'</span>':'';return '<div class="bubble '+(outgoing?'out':'in')+'">'+body+'<div class="bubble-meta"><span>'+escapeHtml(timeLabel(timestampOf(m)))+'</span>'+status+'</div></div>';}).join('')||'<div class="text-center text-xs text-slate-500">Belum ada pesan dalam percakapan ini.</div>';
    $('message-area').scrollTop=$('message-area').scrollHeight; $('composer').classList.remove('hidden');
  }
  function openConversation(phone) { state.active=phone; $('app').classList.add('chat-open'); renderList(); renderChat(); if(state.page!=='reply') setPage('reply'); }
  function setPage(page) { state.page=page; document.querySelectorAll('.page-tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page)); renderList(); if(page==='inbox'&&window.matchMedia('(max-width:700px)').matches) $('app').classList.remove('chat-open'); }
  function upsertMessage(m) {
    if(!m) return; const idx=state.messages.findIndex(x=>x.id===m.id||(m.wamid&&x.wamid===m.wamid));
    if(idx>=0) state.messages[idx]={...state.messages[idx],...m}; else state.messages.push(m);
    buildConversations(); renderList(); if(state.active) renderChat();
  }
  async function loadMessages() {
    try { state.messages=await fetchMessages(1000); buildConversations(); renderList(); if(state.active) renderChat(); }
    catch(error) { console.error(error); setConnection('Periksa akses tabel','#ef4444'); }
  }
  async function sendMessage(event) {
    event.preventDefault(); const c=state.conversations.get(state.active), message=$('message-input').value.trim();
    if(!c||!message||state.sending) return;
    state.sending=true; $('send-button').disabled=true;
    try { await sendWhatsAppMessage(c.phone,message); $('message-input').value=''; await loadMessages(); }
    catch(error) { alert('Pesan gagal dikirim: '+error.message); }
    finally { state.sending=false; $('send-button').disabled=false; $('message-input').focus(); }
  }
  $('search').addEventListener('input',renderList);
  $('composer').addEventListener('submit',sendMessage);
  $('message-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit();}});
  document.querySelectorAll('.page-tab').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
  loadMessages();
  const stopRealtime=subscribeToMessages({
    onMessage:({eventType,record})=>{
      if(eventType==='DELETE'){state.messages=state.messages.filter(m=>m.id!==record?.id);buildConversations();renderList();if(state.active)renderChat();}
      else upsertMessage(record);
    },
    onStatus:status=>{
      if(status==='SUBSCRIBED') setConnection('Realtime aktif','#25d366');
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') setConnection('Realtime terputus','#ef4444');
      else setConnection('Menghubungkan','#f59e0b');
    }
  });
  window.addEventListener('beforeunload',()=>stopRealtime(),{once:true});
})();
</script>
</body>
</html>
