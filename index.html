<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/whatsapp-inbox.svg" type="image/svg+xml">
  <title>WhatsApp Inbox · Apple The Exchange TRX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111b21;
      background: #d9e1e5;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
    }
    body {
      display: flex;
      justify-content: center;
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
    }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }
    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 40px #00000018;
    }
    @supports (height: 100dvh) {
      .app { height: 100dvh; }
    }
    .topbar {
      display: flex;
      flex: 0 0 62px;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 16px;
      color: #fff;
      background: #075e54;
    }
    .brand-mark {
      display: grid;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #ffffff20;
      font-size: 21px;
    }
    .brand-copy { flex: 1; min-width: 0; }
    .brand-title { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .brand-subtitle { margin-top: 3px; color: #d7eee8; font-size: 11px; }
    #connection {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
      color: #e4f3ef;
      font-size: 10px;
      white-space: nowrap;
    }
    .push-button {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #ffffff55;
      border-radius: 18px;
      color: #fff;
      background: #ffffff18;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .push-button:disabled { opacity: .55; cursor: not-allowed; }
    .sound-button { flex: 0 0 auto; min-height: 34px; padding: 0 9px; border: 1px solid #ffffff55; border-radius: 18px; color: #fff; background: #ffffff18; font-size: 10px; font-weight: 600; cursor: pointer; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .workspace {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }
    .sidebar {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      min-height: 0;
      background: #fff;
    }
    .search-wrap {
      flex: 0 0 auto;
      padding: 12px 14px;
      border-bottom: 1px solid #f0f2f5;
    }
    .search-box { position: relative; }
    .search-icon {
      position: absolute;
      top: 50%;
      left: 13px;
      color: #8696a0;
      font-size: 18px;
      line-height: 1;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .search {
      width: 100%;
      height: 42px;
      padding: 0 14px 0 40px;
      border: 0;
      border-radius: 10px;
      outline: none;
      color: #111b21;
      background: #f0f2f5;
      font-size: 13px;
    }
    .search:focus { box-shadow: 0 0 0 2px #128c7e30; }
    .list-toolbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px 10px;
      color: #667781;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    #conversation-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #fff;
    }
    .contact {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      border: 0;
      border-bottom: 1px solid #f3f4f5;
      color: inherit;
      background: #fff;
      text-align: left;
      cursor: pointer;
    }
    .contact:active, .contact.active { background: #f0f2f5; }
    .avatar {
      display: grid;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 50%;
      color: #28665d;
      background: #dce9e6;
      font-size: 14px;
      font-weight: 700;
    }
    .contact-copy { flex: 1 1 auto; min-width: 0; }
    .contact-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .contact-name {
      overflow: hidden;
      color: #111b21;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .contact-time { flex: 0 0 auto; color: #8696a0; font-size: 10px; }
    .contact-preview {
      overflow: hidden;
      margin-top: 4px;
      color: #667781;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .contact-phone { margin-top: 4px; color: #9aa6ad; font-size: 10px; }
    .list-footer {
      flex: 0 0 auto;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid #f0f2f5;
      color: #9aa6ad;
      font-size: 10px;
    }
    .main {
      display: none;
      flex: 1 1 auto;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #efeae2;
    }
    .app.chat-open > .topbar { display: none; }
    .app.chat-open .sidebar { display: none; }
    .app.chat-open .main { display: flex; }
    .chat-header {
      display: flex;
      flex: 0 0 60px;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0 12px;
      color: #111b21;
      background: #f7f8f8;
      border-bottom: 1px solid #e9edef;
    }
    .mobile-back {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 40px;
      place-items: center;
      border: 0;
      color: #128c7e;
      background: transparent;
      font-size: 29px;
      cursor: pointer;
    }
    .chat-contact { flex: 1 1 auto; min-width: 0; }
    .chat-contact-name {
      overflow: hidden;
      color: #111b21;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-contact-phone { margin-top: 3px; color: #667781; font-size: 11px; }
    .chat-bg {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 14px 12px;
      background-color: #efeae2;
      background-image: radial-gradient(#d8d1c7 .65px, transparent .65px);
      background-size: 14px 14px;
      overscroll-behavior: contain;
    }
    .bubble {
      max-width: 88%;
      margin: 8px 0;
      padding: 9px 11px 7px;
      border-radius: 8px;
      box-shadow: 0 1px 1px #00000012;
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .bubble.in { margin-right: auto; border-top-left-radius: 2px; background: #fff; }
    .bubble.out { margin-left: auto; border-top-right-radius: 2px; background: #dcf8c6; }
    .bubble-meta {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 4px;
      color: #718078;
      font-size: 10px;
    }
    .composer {
      display: flex;
      flex: 0 0 auto;
      align-items: flex-end;
      gap: 9px;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: #f0f2f5;
    }
    .composer textarea {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      padding: 12px 16px;
      border: 0;
      border-radius: 22px;
      outline: none;
      color: #111b21;
      background: #fff;
      font-size: 14px;
    }
    .send {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: #128c7e;
      cursor: pointer;
    }
    .send:disabled { opacity: .5; cursor: not-allowed; }
    .empty {
      display: flex;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #667781;
      text-align: center;
    }
    @media (max-width: 380px) {
      #connection { gap: 0; font-size: 0; }
      #connection .status-dot { margin-right: 0; }
      .brand-mark { flex-basis: 34px; width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✆</div>
      <div class="brand-copy">
        <div class="brand-title">WhatsApp Inbox</div>
        <div class="brand-subtitle">Apple The Exchange TRX</div>
      </div>
      <span id="connection" role="status" aria-live="polite">
        <span class="status-dot"></span><span>Menghubungkan</span>
      </span>
      <button id="sound-button" class="sound-button" type="button" aria-pressed="true">Suara: ON</button>
      <button id="push-button" class="push-button" type="button">Aktifkan notifikasi</button>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Daftar percakapan">
        <div class="search-wrap">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search" class="search" type="search" placeholder="Cari nama atau nomor..." aria-label="Cari percakapan" autocomplete="off">
          </label>
        </div>
        <div class="list-toolbar">
          <span>SEMUA PERCAKAPAN</span>
          <span id="conversation-count">0</span>
        </div>
        <div id="conversation-list" aria-live="polite">
          <div class="empty">Memuat percakapan...</div>
        </div>
        <div class="list-footer">Realtime · Supabase</div>
      </aside>

      <main class="main" aria-label="Ruang chat">
        <header id="chat-header" class="chat-header">
          <button class="mobile-back" id="back-button" type="button" aria-label="Kembali ke daftar percakapan">‹</button>
          <div class="avatar" id="chat-avatar" aria-hidden="true">?</div>
          <div class="chat-contact">
            <div class="chat-contact-name" id="chat-name">Percakapan</div>
            <div class="chat-contact-phone" id="chat-phone"></div>
          </div>
        </header>
        <section id="message-area" class="chat-bg" aria-label="Riwayat pesan">
          <div class="empty">Pilih percakapan untuk melihat pesan.</div>
        </section>
        <form id="composer" class="composer">
          <textarea id="message-input" rows="1" placeholder="Ketik pesan..." aria-label="Tulis balasan"></textarea>
          <button id="send-button" class="send" type="submit" aria-label="Kirim pesan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path>
            </svg>
          </button>
        </form>
      </main>
    </div>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
