<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Pesan API</title>
    <!-- Menggunakan Tailwind CSS untuk styling yang cepat, modern, dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8">
        <!-- Header -->
        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Kirim Pesan API</h1>
            <p class="text-sm text-slate-500 mt-1">Kirim pesan langsung melalui Supabase Edge Function.</p>
        </div>

        <!-- Form Input -->
        <form id="messageForm" class="space-y-4">
            <!-- Nomor Tujuan -->
            <div>
                <label for="to" class="block text-sm font-medium text-slate-700 mb-1">Nomor Tujuan</label>
                <input 
                    type="text" 
                    id="to" 
                    name="to" 
                    value="6282311155579"
                    placeholder="Contoh: 6281234567890"
                    required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
                >
                <p class="text-xs text-slate-400 mt-1">Gunakan format kode negara tanpa tanda + (contoh: 628...)</p>
            </div>

            <!-- Isi Pesan -->
            <div>
                <label for="message" class="block text-sm font-medium text-slate-700 mb-1">Isi Pesan</label>
                <textarea 
                    id="message" 
                    name="message" 
                    rows="4" 
                    required
                    placeholder="Tulis pesan Anda di sini..."
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition resize-none"
                >Halo, saya menerima pesan tersebut.</textarea>
            </div>

            <!-- Pengaturan API (Opsional / Tersembunyi secara default agar rapi) -->
            <details class="group border border-slate-200 rounded-xl p-3 bg-slate-50">
                <summary class="text-xs font-medium text-slate-600 cursor-pointer select-none flex items-center justify-between">
                    <span>Konfigurasi Endpoint & API Key</span>
                    <span class="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                </summary>
                <div class="mt-3 space-y-3 pt-3 border-t border-slate-200">
                    <div>
                        <label for="endpoint" class="block text-xs font-medium text-slate-600 mb-1">Endpoint URL</label>
                        <input 
                            type="url" 
                            id="endpoint" 
                            value="https://axednjikcambzbkxyqpp.supabase.co/functions/v1/trx-send-messages"
                            required
                            class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                        >
                    </div>
                    <div>
                        <label for="apikey" class="block text-xs font-medium text-slate-600 mb-1">API Key</label>
                        <input 
                            type="text" 
                            id="apikey" 
                            value="sb_publishable_Vysddy5_b0uZ3iKgnkDTIw_X5O1pBEd"
                            required
                            class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                        >
                    </div>
                </div>
            </details>

            <!-- Tombol Submit -->
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-medium text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-2 cursor-pointer"
            >
                <span id="btnText">Kirim Pesan</span>
                <!-- Spinner Loading (Tersembunyi secara default) -->
                <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <!-- Kotak Notifikasi / Hasil Response -->
        <div id="responseContainer" class="hidden mt-6">
            <div class="flex items-center justify-between mb-1.5">
                <span id="statusBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full">Status</span>
                <button type="button" id="clearResponse" class="text-xs text-slate-400 hover:text-slate-600">Tutup</button>
            </div>
            <pre id="responseOutput" class="w-full p-3.5 rounded-xl bg-slate-900 text-slate-100 text-xs overflow-x-auto font-mono leading-relaxed"></pre>
        </div>
    </div>

    <script>
        // Mengambil referensi elemen DOM
        const form = document.getElementById('messageForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const responseContainer = document.getElementById('responseContainer');
        const statusBadge = document.getElementById('statusBadge');
        const responseOutput = document.getElementById('responseOutput');
        const clearResponseBtn = document.getElementById('clearResponse');

        // Fungsi untuk mengatur status loading pada tombol
        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = 'Mengirim...';
                btnSpinner.classList.remove('hidden');
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                btnText.textContent = 'Kirim Pesan';
                btnSpinner.classList.add('hidden');
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        // Fungsi untuk menampilkan hasil response di layar
        function showResponse(isSuccess, statusCode, data) {
            responseContainer.classList.remove('hidden');
            
            if (isSuccess) {
                statusBadge.textContent = `Sukses (${statusCode})`;
                statusBadge.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
            } else {
                statusBadge.textContent = `Gagal (${statusCode})`;
                statusBadge.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700';
            }

            // Format JSON agar mudah dibaca jika data berupa objek
            if (typeof data === 'object') {
                responseOutput.textContent = JSON.stringify(data, null, 2);
            } else {
                responseOutput.textContent = data;
            }
        }

        // Event listener saat form disubmit
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah reload halaman

            // Ambil nilai dari input
            const endpoint = document.getElementById('endpoint').value.trim();
            const apikey = document.getElementById('apikey').value.trim();
            const to = document.getElementById('to').value.trim();
            const message = document.getElementById('message').value.trim();

            setLoading(true);
            responseContainer.classList.add('hidden');

            try {
                // Eksekusi request POST sesuai perintah cURL
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': apikey
                    },
                    body: JSON.stringify({
                        to: to,
                        message: message
                    })
                });

                // Mencoba parsing response sebagai JSON, jika gagal ambil sebagai teks biasa
                const contentType = response.headers.get('content-type');
                let responseData;
                if (contentType && contentType.includes('application/json')) {
                    responseData = await response.json();
                } else {
                    responseData = await response.text();
                }

                showResponse(response.ok, response.status, responseData);

            } catch (error) {
                // Menangani error jaringan atau CORS
                showResponse(false, 'Network/CORS Error', {
                    error: error.message,
                    info: 'Pastikan koneksi internet aktif dan server mengizinkan CORS dari origin ini.'
                });
            } finally {
                setLoading(false);
            }
        });

        // Tombol untuk menutup kotak hasil
        clearResponseBtn.addEventListener('click', () => {
            responseContainer.classList.add('hidden');
        });
    </script>
</body>
</html>
